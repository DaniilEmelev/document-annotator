<div
  #pageEl
  class="document-page"
  [style.cursor]="annotationService.draft() ? 'crosshair' : 'default'"
  [attr.data-page-number]="page().number"
  [style.width.px]="baseWidth * zoomService.scale()"
  (click)="onClick($event)"
>
  <img [src]="page().imageUrl" [alt]="'Page ' + page().number" />

  @for (annotation of annotations(); track annotation.id) {
    <app-annotation-item [annotation]="annotation" [boundary]="pageEl" />
  }
</div>
